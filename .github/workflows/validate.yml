name: validate

on:
  push:
  pull_request:

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: python -m compileall -q conus_zero_shot_law_transfer_2026-09-30 conus_daily_process_observability_2026-10-12 workflow tests
      - run: python workflow/validate_release.py
      - run: pytest -q
      - run: python conus_zero_shot_law_transfer_2026-09-30/scripts/00_test_mass_conservation.py
