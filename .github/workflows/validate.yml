name: validate-release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pandas==2.2.3 pytest==8.3.5
      - run: python workflow/validate_release.py
      - run: pytest -q
